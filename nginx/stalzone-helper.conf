# ============================================================
# stalzone-helper.ru — StalZone Craft (перенос с pmcgame.ru/mvp)
# Лежит в /home/pavel/text_rpg/eblia/backend/nginx/ (монтируется как conf.d).
# После правок: docker exec rpg_nginx nginx -t && docker exec rpg_nginx nginx -s reload
# ============================================================

# HTTP — ACME challenge для certbot + редирект всего остального на https
server {
    listen 80;
    server_name stalzone-helper.ru www.stalzone-helper.ru;
    charset utf-8;

    # Certbot challenge (webroot — docker-том backend_certbot_www)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — приложение на корне домена
server {
    listen 443 ssl http2;
    server_name stalzone-helper.ru www.stalzone-helper.ru;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/stalzone-helper.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stalzone-helper.ru/privkey.pem;

    # Загрузка картинок в редакторах (гайды/квесты): бэкенд-лимит одной картинки
    # GUIDE_IMG_MAX_MB=6, base64 в JSON раздувает ~×1.33 → ставим с запасом.
    # Без этой строки дефолт nginx = 1 МБ и крупные скрины ловят 413.
    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    # ВАЖНО: StaticFiles отдаёт .js с Content-Type "text/javascript" (питоновский
    # mimetypes с 3.12), а не "application/javascript" — без этого типа в списке
    # app.js (374 КБ) и leaflet.js (147 КБ) ехали БЕЗ сжатия. С gzip → ~105/45 КБ.
    gzip_types text/css text/plain text/xml text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # Совместимость со старыми ссылками /mvp/* (и с OAuth redirect URI
    # https://stalzone-helper.ru/mvp/auth/callback — 301 сохраняет query string).
    location = /mvp { return 301 /; }
    location /mvp/ {
        rewrite ^/mvp/(.*)$ /$1 permanent;
    }

    # Вебсокеты (ДЕВ-сканер лотов /api/ws/dev/scan): нужен Upgrade-хендшейк.
    # Клиент шлёт ping каждые ~25 с — 120 с read timeout соединение не убьёт.
    location /api/ws/ {
        proxy_pass http://stalzone_craft:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ------------------------------------------------------------------
    # Кэш статики. StaticFiles шлёт только etag/last-modified, без
    # Cache-Control — браузер применял эвристику и ревалидировал почти
    # каждый файл при каждом переходе. А «вкладки» сайта — это отдельные
    # серверные страницы (/market, /builds, /quests…), т.е. полная
    # перезагрузка: app.js + styles.css + десятки иконок и тайлов карты,
    # каждый со своим round-trip. Отсюда и «долго прогружаются вкладки».
    # ------------------------------------------------------------------

    # app.js / styles.css — версионируются через ?v=<mtime> (pages.py),
    # деплой сам меняет URL, поэтому можно immutable на год.
    location ~* ^/(?:app\.js|styles\.css|styles-b\.css)$ {
        proxy_pass http://stalzone_craft:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Иконки, тайлы карты, картинки гайдов, вендорный leaflet. URL не
    # версионированы, но содержимое по адресу неизменно (загрузки гайдов
    # получают уникальное имя). 30 дней — компромисс: при подмене файла
    # на месте (напр. апгрейд leaflet) достаточно переименовать.
    location ~* \.(?:js|css|webp|png|jpe?g|gif|svg|ico|woff2?)$ {
        proxy_pass http://stalzone_craft:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        proxy_pass http://stalzone_craft:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
