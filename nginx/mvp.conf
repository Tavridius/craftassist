# Старый адрес StalZone Craft — pmcgame.ru/mvp. Приложение переехало на корень
# stalzone-helper.ru, поэтому здесь остался только 301-редирект (важно для SEO:
# два адреса с одинаковым контентом = дубль, поисковики размывают выдачу).
# Добавить ЭТИ location-блоки внутрь существующего server { } домена pmcgame.ru.
# Затем: docker exec rpg_nginx nginx -t && docker exec rpg_nginx nginx -s reload
#
# OAuth redirect URI зарегистрирован на https://stalzone-helper.ru/mvp/auth/callback —
# его обслуживает stalzone-helper.conf (свой /mvp-редирект с сохранением query).

location = /mvp {
    return 301 https://stalzone-helper.ru/;
}

location /mvp/ {
    # rewrite сохраняет query string автоматически
    rewrite ^/mvp/(.*)$ https://stalzone-helper.ru/$1 permanent;
}
