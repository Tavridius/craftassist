# Проксирование StalZone Craft на путь /mvp.
# Добавить ЭТИ location-блоки внутрь существующего server { } (тот, что listen 80),
# который обслуживает pmcgame.ru / IP сервера. Затем: nginx -t && reload.
#
# Контейнер stalzone_craft подключён к сети backend_rpg_network, поэтому nginx
# достаёт его по имени контейнера. Трейлинг-слэш в proxy_pass срезает префикс /mvp/,
# бэкенд отдаёт всё от корня, фронт на относительных путях — работает под /mvp.

location = /mvp {
    return 301 /mvp/;
}

location /mvp/ {
    proxy_pass http://stalzone_craft:8000/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
