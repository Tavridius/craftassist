services:
  stalzone-craft:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: stalzone-craft:latest
    container_name: stalzone_craft
    restart: unless-stopped
    # localhost-порт для curl-проверок на сервере; наружу отдаёт rpg_nginx через /mvp
    ports:
      - "127.0.0.1:8100:8000"
    environment:
      # Демо по умолчанию. Для реальных цен задать в .env креды TradeAssist:
      #   API_BASE=https://eapi.stalcraft.net + API_CLIENT_ID/API_CLIENT_SECRET
      #   (или статический API_TOKEN как fallback)
      - API_BASE=${API_BASE:-https://dapi.stalcraft.net}
      - API_TOKEN=${API_TOKEN:-}
      - API_CLIENT_ID=${API_CLIENT_ID:-}
      - API_CLIENT_SECRET=${API_CLIENT_SECRET:-}
      - REGION=${REGION:-RU}
      - PRICE_CACHE_TTL=${PRICE_CACHE_TTL:-600}
      - AUCTION_MIN_INTERVAL=${AUCTION_MIN_INTERVAL:-0.5}
      - CRAFT_MAX_DEPTH=${CRAFT_MAX_DEPTH:-4}
      - CRAFT_MAX_VARIANTS=${CRAFT_MAX_VARIANTS:-3}
      # Авторизация пользователей (OAuth EXBO): внешний адрес приложения за прокси.
      # redirect_uri = PUBLIC_BASE_URL + /auth/callback — зарегистрировать на exbo.net.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-30}
      # Биржа артефактов: снапшоты корзин качество×заточка (см. config.py)
      - ART_WATCH_ENABLED=${ART_WATCH_ENABLED:-1}
      - ART_WATCH_HOURS=${ART_WATCH_HOURS:-1,7,13,19}
      - ART_WATCH_MAX_PAGES=${ART_WATCH_MAX_PAGES:-3}
      - ART_MIN_SALES=${ART_MIN_SALES:-5}
      - ART_KEEP_DAYS=${ART_KEEP_DAYS:-35}
      # Живые лоты артефактов + источник цен калькулятора (auto/lots/avg7d)
      - ART_LOTS_ENABLED=${ART_LOTS_ENABLED:-1}
      - ART_LOTS_MINUTES=${ART_LOTS_MINUTES:-30}
      - ART_LOTS_MAX_PAGES=${ART_LOTS_MAX_PAGES:-2}
      - ART_LOTS_TOP=${ART_LOTS_TOP:-5}
      - BUILD_PRICE_SOURCE=${BUILD_PRICE_SOURCE:-auto}
      # Патчноуты с форума EXBO + комментарии
      - PATCH_WATCH_ENABLED=${PATCH_WATCH_ENABLED:-1}
      - PATCH_POLL_MIN=${PATCH_POLL_MIN:-30}
      # EXBO id админов через запятую — могут удалять чужие комментарии
      - ADMIN_USER_IDS=${ADMIN_USER_IDS:-}
    volumes:
      # Кэш игровой БД + зеркало иконок (скачивается один раз при первом старте)
      - craft_data:/app/backend/data
    networks:
      - rpgnet

networks:
  # существующая сеть, где живёт rpg_nginx — чтобы он ходил к нам по имени контейнера
  rpgnet:
    external: true
    name: backend_rpg_network

volumes:
  craft_data:
