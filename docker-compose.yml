services:
  stalzone-craft:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: stalzone-craft:latest
    container_name: stalzone_craft
    restart: unless-stopped
    # api.telegram.org резолвится с сервера в 149.154.166.110, а он не отвечает
    # (проверено 30.09.2026: curl --resolve через .166.110 и .167.221 — тишина,
    # через .167.220 — ok). Бот без этого падал с Network is unreachable.
    extra_hosts:
      - "api.telegram.org:${TG_API_IP:-149.154.167.220}"
    # localhost-порт для curl-проверок на сервере; наружу отдаёт rpg_nginx через /mvp
    ports:
      - "127.0.0.1:8100:8000"
    environment:
      # Демо по умолчанию. Для реальных цен задать в .env креды TradeAssist:
      #   API_BASE=https://eapi.stalcraft.net + API_CLIENT_ID/API_CLIENT_SECRET
      #   (или статический API_TOKEN как fallback)
      - API_BASE=${API_BASE:-https://dapi.stalcraft.net}
      - API_TOKEN=${API_TOKEN:-}
      - API_CLIENT_ID=${API_CLIENT_ID:-}
      - API_CLIENT_SECRET=${API_CLIENT_SECRET:-}
      - REGION=${REGION:-RU}
      - PRICE_CACHE_TTL=${PRICE_CACHE_TTL:-600}
      - AUCTION_MIN_INTERVAL=${AUCTION_MIN_INTERVAL:-0.5}
      - CRAFT_MAX_DEPTH=${CRAFT_MAX_DEPTH:-4}
      - CRAFT_MAX_VARIANTS=${CRAFT_MAX_VARIANTS:-3}
      # Авторизация: локальная (email+пароль) всегда; EXBO OAuth — по кредам выше.
      # PUBLIC_BASE_URL — внешний адрес за прокси; redirect_uri = +/auth/callback (exbo.net).
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-30}
      - PASSWORD_MIN_LEN=${PASSWORD_MIN_LEN:-8}
      # Почта (подтверждение email + сброс пароля); пусто — письма не шлются
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-StalZone Helper}
      - EMAIL_TOKEN_TTL_HOURS=${EMAIL_TOKEN_TTL_HOURS:-24}
      # Telegram-бот канала t.me/stalzone_helper: патчи и выбросы (см. DEPLOY.md).
      # Без TG_BOT_TOKEN бот молчит.
      - TG_BOT_TOKEN=${TG_BOT_TOKEN:-}
      - TG_CHANNEL=${TG_CHANNEL:-@stalzone_helper}
      - TG_API_BASE=${TG_API_BASE:-https://api.telegram.org}
      - TG_NOTIFY_PATCHES=${TG_NOTIFY_PATCHES:-1}
      - TG_NOTIFY_EMISSIONS=${TG_NOTIFY_EMISSIONS:-1}
      - TG_EMISSION_TTL_MIN=${TG_EMISSION_TTL_MIN:-20}
      # Биржа артефактов: снапшоты корзин качество×заточка (см. config.py)
      - ART_WATCH_ENABLED=${ART_WATCH_ENABLED:-1}
      - ART_WATCH_HOURS=${ART_WATCH_HOURS:-1,7,13,19}
      - ART_WATCH_MAX_PAGES=${ART_WATCH_MAX_PAGES:-3}
      - ART_MIN_SALES=${ART_MIN_SALES:-5}
      - ART_KEEP_DAYS=${ART_KEEP_DAYS:-35}
      # Живые лоты артефактов + источник цен калькулятора (auto/lots/avg7d)
      - ART_LOTS_ENABLED=${ART_LOTS_ENABLED:-1}
      - ART_LOTS_MINUTES=${ART_LOTS_MINUTES:-30}
      - ART_LOTS_MAX_PAGES=${ART_LOTS_MAX_PAGES:-2}
      - ART_LOTS_TOP=${ART_LOTS_TOP:-5}
      - BUILD_PRICE_SOURCE=${BUILD_PRICE_SOURCE:-auto}
      # Патчноуты с форума EXBO + комментарии
      - PATCH_WATCH_ENABLED=${PATCH_WATCH_ENABLED:-1}
      - PATCH_POLL_MIN=${PATCH_POLL_MIN:-30}
      # Админы (комментарии, DEV-редактор карты, редактор гайдов):
      # EXBO id через запятую и/или email локальных аккаунтов через запятую
      - ADMIN_USER_IDS=${ADMIN_USER_IDS:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      # A/B-тест дизайна: 1 = половине посетителей вариант B (styles-b.css),
      # вариант уходит в Я.Метрику параметром визита ab_design. По умолчанию выкл.
      - AB_TEST_DESIGN=${AB_TEST_DESIGN:-0}
      - AB_TEST_SPLIT=${AB_TEST_SPLIT:-0.5}
      - AB_TEST_TTL_DAYS=${AB_TEST_TTL_DAYS:-90}
      # Реклама РСЯ: идентификатор блока «в тексте» (вид R-A-1234567-1).
      # Пусто = рекламы нет и скрипт Яндекса не грузится. Показывается только
      # в статьях (/guides/*, /patches/*), на калькуляторах её нет.
      - RSYA_BLOCK_ID=${RSYA_BLOCK_ID:-}
      # второй блок — под контентом разделов (списки, калькуляторы, карточки)
      - RSYA_BLOCK_BOTTOM=${RSYA_BLOCK_BOTTOM:-}
    volumes:
      # Кэш игровой БД + зеркало иконок (скачивается один раз при первом старте)
      - craft_data:/app/backend/data
    networks:
      - rpgnet

networks:
  # существующая сеть, где живёт rpg_nginx — чтобы он ходил к нам по имени контейнера
  rpgnet:
    external: true
    name: backend_rpg_network

volumes:
  craft_data:
